name: Tests

# Unit tests only — pure logic, no network, no data-repo checkout needed
# (that's by design: lib paths resolve lazily). The nightly DATA build
# lives in openasn/openasn's nightly-build.yml, which checks this repo out.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7 # v4 targets deprecated Node 20 (github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners); v5-v7 = Node 24 + hardening, no input changes

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true

      - name: Run unit tests
        run: bundle exec rake test
